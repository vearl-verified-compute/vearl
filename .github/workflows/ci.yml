name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: vearl-core
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vearl-core
      # the tools that the end-to-end pool test runs check Ed25519 signatures with this package
      - name: python dependencies
        run: pip install cryptography
      # CPU build: the GPU kernels need a CUDA toolkit and a card, they are tested by hand (docs/15 section 3)
      - name: build
        run: cargo build --release --bins
      - name: test
        run: |
          set +e
          cargo test --release --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # list the failing tests as annotations, so that they are visible without opening the full log
          grep -E "^test .* FAILED$|panicked at|^error(\[|:)" test.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $status
      # Python tools and the independent tensor-reference regression tests.
      - name: python tools tests
        if: runner.os == 'Linux'
        run: |
          pip install cryptography numpy blake3
          python -m unittest discover -s tools -p "test_*.py"

  wallet-gui:
    name: wallet window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: vearl-wallet-gui
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vearl-wallet-gui
      # the window itself needs a display: CI only builds it and runs the logic tests (the end-to-end test needs a node and is skipped)
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --release --locked
