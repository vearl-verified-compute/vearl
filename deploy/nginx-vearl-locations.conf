# Shared by every Vearl server block (installed to /etc/nginx/snippets/vearl-locations.conf by deploy/deploy-site.sh)
root /var/www/vearl;
index index.html;
charset utf-8;
server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript image/svg+xml text/plain application/json;

error_page 404 /404.html;

location = /404.html {
    internal;
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# fonts never change for a given file name
location ^~ /fonts/ {
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# the launch film of the home page (site/assets/film): its file names carry the version, so it is cached for a year too; the captions
# (WebVTT) need their own type, which nginx's mime.types does not know (with nosniff a browser would refuse them otherwise)
location ^~ /assets/film/ {
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    types { video/mp4 mp4; text/vtt vtt; image/jpeg jpg; }
}

# stylesheets and scripts are referenced with a content fingerprint (?v=hash): cache for a year
location ^~ /assets/ {
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# testnet contributors leaderboard (docs/19): written by deploy/rewards/ outside /var/www/vearl, so that republishing the site never removes it
location ^~ /rewards/ {
    alias /var/www/vearl-rewards/;
    autoindex off;
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
    types { application/json json; text/csv csv; }
    default_type application/json;
}

location ~* \.(png|svg|ico)$ {
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
}

# Let's Encrypt HTTP-01 challenge (certbot --webroot)
location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }

# no hidden files, no source or build folders
location ~ /\. { deny all; }
location ^~ /tools/ { return 404; }

# clean URLs: /whitepaper, /credits. The old *.html addresses (and /index.html) redirect to them, query string kept
# (nginx serves / by an internal jump to /index.html: only a request that really asked for /index.html is redirected)
location = /index.html {
    if ($request_uri ~ ^/index\.html) { return 301 /$is_args$args; }
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location ~ ^/([a-z0-9-]+)\.html$ {
    if (-f $document_root/$1.html) { return 301 /$1$is_args$args; }
    return 404;
}

location = /favicon.ico {
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files /favicon-32.png =404;
}

# testnet explorer: the page is /explorer/ (a static single-page app); it reads the node's read-only JSON API through /api/.
# The node listens on 127.0.0.1:8545 (node --api 127.0.0.1:8545). GET only: the explorer never writes, and a public relay of
# unsigned-by-us transactions is not offered here. /api/wait is a long poll (up to 25 s), hence the longer read timeout.
# Until a public node runs behind this address the explorer shows "No node reachable" (nginx answers 502).
# the fee-audit beacons (Vearl account + Quantus address of the miners) are for the local auditor only, never public (docs/17)
location = /api/fee/beacons { return 404; }

location ^~ /api/ {
    limit_req zone=vearl_api burst=40 nodelay;
    limit_except GET { deny all; }
    include /etc/nginx/snippets/vearl-api.conf;   # which node answers: nginx-vearl-api-sample.conf (demo network, before the launch) or nginx-vearl-api-live.conf (the real node)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    # micro-cache: the node's HTTP server takes 64 connections at a time (and 16 long polls), so a crowd of visitors (the launch) would get 503 from it.
    # Everybody that asks for the same URL within one second shares ONE request to the node; if the node is busy or slow, the last answer is served.
    proxy_cache vearl_micro;
    proxy_cache_key "api$uri$is_args$args";
    proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    proxy_cache_lock_age 30s;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Cache $upstream_cache_status always;
}

# the genesis file of the testnet: put in this folder by vearl-genesis-publish.timer at the launch instant. Before that the folder is empty (404): nobody can
# prepare blocks in advance, because a block commits to the state of the genesis, which includes an allocation nobody knows yet.
location = /genesis.json {
    alias /var/lib/vearl-genesis-public/genesis.json;
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
}

# testnet faucet: the page is /faucet/ (static), the request is POST /drip to the faucet service on 127.0.0.1:8081 (vearl-faucet).
# nginx passes the visitor's address in X-Real-IP and the faucet (listening on the loopback) uses it for its per-IP limit.
# Until the faucet runs, the page answers "cannot reach the network" (nginx answers 502).
location = /drip {
    limit_req zone=vearl_faucet burst=3 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}

# job gateway behind the free "create a job" site (/compute/). The file below is chosen at deploy time (deploy-site.sh --nginx [--gw-live]):
#   nginx-vearl-gw-prelaunch.conf  before the testnet starts: fixed answers, the page is complete but no job can be created (default)
#   nginx-vearl-gw-live.conf       after: the real gateway on 127.0.0.1:18600
include /etc/nginx/snippets/vearl-gw.conf;

location / {
    try_files $uri $uri.html $uri/ =404;
    include /etc/nginx/snippets/vearl-headers.conf;
    add_header Cache-Control "no-cache" always;
}
