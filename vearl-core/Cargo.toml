[package]
name = "vearl-core"
version = "0.1.0"
edition = "2021"
description = "VEARL testnet core: fee-bound proof of useful work + in-protocol compute market"
license = "Apache-2.0"
homepage = "https://vearl.org"
publish = false

[dependencies]
snow = "0.9"
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
bip39 = "2"
bech32 = "0.11"
rpassword = "7"
base64 = "0.22"
blake3 = "1"
sha2 = "0.10" # SHA-256 of the pool points documents (docs/16 section 13), also available to the Python tools
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rand = "0.8"
# post-quantum signatures SLH-DSA-SHAKE-128s: `fips205` crate (final FIPS 205, pure Rust, no unsafe; UNAUDITED)
fips205 = "=0.4.1"
# e-mail registration for the testnet rewards (docs/19): TLS client, pure Rust trust anchors; only used by `vearl-wallet register`
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
# deflate of the outputs of operations sent to a client (`GetOpsBoxZ`, docs/21 section 4 bis): pure Rust, no unsafe code; not used by consensus
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[[bin]]
name = "devnet"
path = "src/bin/devnet.rs"

[profile.release]
opt-level = 3

[build-dependencies]
blake3 = "1"

[features]
default = ["mail"]
mail = ["dep:rustls", "dep:webpki-roots"] # `vearl-wallet register` (build with --no-default-features where no C compiler is available for the target)
devtools = [] # test options (--partner-cmd, free --qtc-args) ABSENT from release builds (docs/17)
gpu = [] # CUDA kernel (nvcc required); VEARL_CUDA_ARCH=86 by default (A10)

[[bin]]
name = "gpubench"
path = "src/bin/gpubench.rs"
required-features = ["gpu"]

[[test]]
name = "gpu"
path = "tests/gpu.rs"
required-features = ["gpu"]

[[bin]]
name = "gpumine"
path = "src/bin/gpumine.rs"
required-features = ["gpu"]

[[bin]]
name = "node"
path = "src/bin/node.rs"

[[bin]]
name = "vearl-cli"
path = "src/bin/cli.rs"

[[bin]]
